security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: login

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            user_checker: App\Security\UserChecker # <-- Bloque ici si le prof n'a pas validé son code
            json_login:
                check_path: /api/login
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            user_checker: App\Security\UserChecker # <-- Sécurité supplémentaire pour les requêtes API suivantes
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # 1. Les accès publics (aucune restriction)
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/verify-code, roles: PUBLIC_ACCESS }
        - { path: ^/api/ia/groq, roles: PUBLIC_ACCESS }
        - { path: ^/api$, roles: PUBLIC_ACCESS, methods: [ GET ] }

        # 2. Les routes spécifiques restreintes par rôles
        - { path: ^/api/classes, roles: [ ROLE_USER_PROFESSEUR, ROLE_ADMIN ] }
        - { path: ^/api/eleves, roles: [ ROLE_USER_PROFESSEUR, ROLE_ADMIN ] }

        # 3. La sécurité globale (tout le reste de l'API requiert d'être connecté)
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
