services:
    php:
        build: .
        restart: always
        environment:
            APP_ENV: prod
            GROQ_API_KEY: ${GROQ_API_KEY}
        volumes:
            - .:/var/www

    nginx:
        image: nginx:alpine
        restart: always
        ports:
            - "80:80"
        volumes:
            - .:/var/www
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
